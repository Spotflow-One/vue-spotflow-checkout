name: Hacktoberfest PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  validate-hacktoberfest-pr:
    name: Validate Hacktoberfest PR
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'hacktoberfest') || contains(github.event.pull_request.labels.*.name, 'hacktoberfest-accepted')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check PR quality
        id: quality-check
        run: |
          # Count changed files
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | wc -l)
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          
          # Count lines added/removed
          LINES_ADDED=$(git diff --numstat origin/main...HEAD | awk '{added+=$1} END {print added+0}')
          LINES_REMOVED=$(git diff --numstat origin/main...HEAD | awk '{removed+=$2} END {print removed+0}')
          echo "lines_added=$LINES_ADDED" >> $GITHUB_OUTPUT
          echo "lines_removed=$LINES_REMOVED" >> $GITHUB_OUTPUT
          
          # Check if it's a meaningful contribution
          if [ $LINES_ADDED -lt 5 ] && [ $CHANGED_FILES -lt 2 ]; then
            echo "quality=low" >> $GITHUB_OUTPUT
            echo "This appears to be a low-quality contribution (less than 5 lines added and less than 2 files changed)"
          else
            echo "quality=good" >> $GITHUB_OUTPUT
          fi

      - name: Run linting
        run: npm run lint:check
        continue-on-error: true
        id: lint

      - name: Run type checking
        run: npm run type-check
        continue-on-error: true
        id: typecheck

      - name: Build project
        run: npm run build
        continue-on-error: true
        id: build

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const changedFiles = '${{ steps.quality-check.outputs.changed_files }}';
            const linesAdded = '${{ steps.quality-check.outputs.lines_added }}';
            const linesRemoved = '${{ steps.quality-check.outputs.lines_removed }}';
            const quality = '${{ steps.quality-check.outputs.quality }}';
            
            const lintSuccess = '${{ steps.lint.outcome }}' === 'success';
            const typecheckSuccess = '${{ steps.typecheck.outcome }}' === 'success';
            const buildSuccess = '${{ steps.build.outcome }}' === 'success';
            
            let emoji = '🎃';
            let message = `## ${emoji} Hacktoberfest PR Review\n\n`;
            
            message += `**Contribution Stats:**\n`;
            message += `- Files changed: ${changedFiles}\n`;
            message += `- Lines added: ${linesAdded}\n`;
            message += `- Lines removed: ${linesRemoved}\n\n`;
            
            message += `**Quality Checks:**\n`;
            message += `- ${lintSuccess ? '✅' : '❌'} Linting\n`;
            message += `- ${typecheckSuccess ? '✅' : '❌'} Type checking\n`;
            message += `- ${buildSuccess ? '✅' : '❌'} Build\n\n`;
            
            if (quality === 'low') {
              message += `⚠️ **Quality Notice:** This PR appears to have minimal changes. For Hacktoberfest, we encourage meaningful contributions that add value to the project.\n\n`;
            }
            
            if (lintSuccess && typecheckSuccess && buildSuccess && quality === 'good') {
              message += `🎉 **Great work!** This PR passes all checks and appears to be a meaningful contribution. Thank you for participating in Hacktoberfest!\n\n`;
              message += `Don't forget to add the \`hacktoberfest-accepted\` label to count this PR toward your Hacktoberfest goal.`;
            } else {
              message += `📝 **Action needed:** Please address the failing checks above before this PR can be considered for Hacktoberfest.`;
            }
            
            // Add comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });

      - name: Add hacktoberfest-accepted label
        if: steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.build.outcome == 'success' && steps.quality-check.outputs.quality == 'good'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['hacktoberfest-accepted']
            });